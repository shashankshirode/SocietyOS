name: Mobile Quality

on:
  pull_request:
    paths:
      - 'apps/mobile/**'
      - 'contracts/**'
      - '.github/workflows/mobile-quality.yml'
  push:
    branches:
      - main
    paths:
      - 'apps/mobile/**'
      - 'contracts/**'
      - '.github/workflows/mobile-quality.yml'

jobs:
  quality:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: TypeScript verification
        run: npm run typecheck

      - name: ESLint verification
        run: npm run lint

      - name: Jest test suite
        run: npm run test -- --runInBand --forceExit

      - name: Verify resident routes
        run: npm run verify:resident-routes
